name: Build Hindi Bible APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Android bundle check
        run: npx expo export --platform android

      - name: Set up EAS
        if: ${{ secrets.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build installable APK
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Explain missing Expo token
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "::error::APK build needs an Expo access token. Add EXPO_TOKEN in GitHub repository Settings > Secrets and variables > Actions, then rerun this workflow."
          exit 1
